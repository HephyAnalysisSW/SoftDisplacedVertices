  Jet_neHEF_sel: ['Jet_neHEF[{0}]',jet_sel]
  Jet_nConstituents_sel: ['Jet_nConstituents[{0}]',jet_sel]
  Jet_eta_selHEM: ['Jet_eta[{0}]',jet_selHEM]
  Jet_phi_selHEM: ['Jet_phi[{0}]',jet_selHEM]
  nJetHEM: "isData*(run>=319077)*(run<=325175)*Sum((Jet_eta_selHEM>-3.0) && (Jet_eta_selHEM<-1.3) && (Jet_phi_selHEM>-1.57) && (Jet_phi_selHEM<-0.87))"
  nJet_sel: ['Sum({0})',jet_sel]
  leadingjet_pt: Jet_pt_sel[0]
  leadingjet_phi: Jet_phi_sel[0]
  leadingjet_eta: Jet_eta_sel[0]
  leadingjet_chHEF: Jet_chHEF_sel[0]
  leadingjet_neHEF: Jet_neHEF_sel[0]
  leadingjet_nConstituents: Jet_nConstituents_sel[0]
  allJet_nConstituents: 'Sum(Jet_nConstituents_sel)'
  diffleadingjet_pt: 'Max(Jet_pt_sel)-leadingjet_pt'
  dphi_MET_jet0: acos(cos(leadingjet_phi-MET_phi_corr))
  Jet_dphi_MET_sel: acos(cos(Jet_phi_sel-MET_phi_corr))
  nJet_sel_lowdphi: "Sum(Jet_dphi_MET_sel<1.5)"
  nJet_sel_highdphi: "Sum(Jet_dphi_MET_sel>1.5)"
  nJet_sel_lowdphi_noleading: "Jet_dphi_MET_sel[0]>1.5 ? nJet_sel_lowdphi : nJet_sel_lowdphi-1"
  nJet_sel_highdphi_noleading: "Jet_dphi_MET_sel[0]>1.5 ? nJet_sel_highdphi - 1 : nJet_sel_highdphi"
  JetHT: 'Sum(Jet_pt_sel)'
  JetHT20: 'Sum(Jet_pt_sel[Jet_pt_sel>20.])'
  JetHT40: 'Sum(Jet_pt_sel[Jet_pt_sel>40.])'
  nMuon_sel: ['Sum({0})', muon_sel]
  nEle_sel: ['Sum({0})', ele_sel]
  nPhoton_sel: ['Sum({0})', photon_sel]
  nTau_sel: ['Sum({0})', tau_sel]
  nbJet_loose: ['Sum({0})',bjetloose]
  nbJet_medium: ['Sum({0})',bjetmedium]
  nbJet_tight: ['Sum({0})',bjettight]
  bJet_eta_loose: ['Jet_eta[{0}]',bjetloose]
  bJet_phi_loose: ['Jet_phi[{0}]',bjetloose]
  bJet_eta_medium: ['Jet_eta[{0}]',bjetmedium]
  bJet_phi_medium: ['Jet_phi[{0}]',bjetmedium]
  bJet_eta_tight: ['Jet_eta[{0}]',bjettight]
  bJet_phi_tight: ['Jet_phi[{0}]',bjettight]
  SDVTrack_isInSV: Track_isInSV(SDVIdxLUT_TrackIdx,nSDVTrack)
  SDVTrack_qoverp: SDVTrack_charge/SDVTrack_pt
  SDVTrack_dxySig: abs(SDVTrack_dxy)/SDVTrack_dxyError
  SDVTrack_dzSig: abs(SDVTrack_dz)/SDVTrack_dzError
  SDVTrack_ptqual: SDVTrack_ptError/SDVTrack_pt
  SDVTrack_dphi_jet0: acos(cos(SDVTrack_phi-leadingjet_phi))
  SDVTrack_deta_jet0: abs(SDVTrack_eta-leadingjet_eta)
  SDVTrack_dR_jet0: sqrt(SDVTrack_dphi_jet0*SDVTrack_dphi_jet0 + SDVTrack_deta_jet0*SDVTrack_deta_jet0)
  SDVTrack_dphi_MET: acos(cos(SDVTrack_phi-MET_phi_corr))
  SDVTrack_dxydzratio: abs(SDVTrack_dxy/SDVTrack_dz)

  SDVTrack_isGoodTrack: ( (abs(SDVTrack_dxy)/SDVTrack_dxyError)>4 ) && (SDVTrack_normalizedChi2 < 5) && (SDVTrack_numberOfValidHits>13) && ( (SDVTrack_ptError/SDVTrack_pt)<0.015 ) && ( SDVTrack_dxydzratio>0.25 ) && ( SDVTrack_dphi_jet0>1 ) && ( SDVTrack_dphi_MET<1.5 ) && (SDVTrack_pfRelIso03_all<5)
  SDVTrack_isGoodTrack_highdphi: ( (abs(SDVTrack_dxy)/SDVTrack_dxyError)>4 ) && (SDVTrack_normalizedChi2 < 5) && (SDVTrack_numberOfValidHits>13) && ( (SDVTrack_ptError/SDVTrack_pt)<0.015 ) && ( SDVTrack_dxydzratio>0.25 ) && ( SDVTrack_dphi_jet0>0.4 ) && ( SDVTrack_dphi_MET>1.5 ) && (SDVTrack_pfRelIso03_all<5)
  #SDVTrack_isGoodTrack: ( (abs(SDVTrack_dxy)/SDVTrack_dxyError)>4 ) && (SDVTrack_normalizedChi2 < 5) && (SDVTrack_numberOfValidHits>13) && ( (SDVTrack_ptError/SDVTrack_pt)<0.015 ) && ( SDVTrack_dxydzratio>0.25 ) && (SDVTrack_pfRelIso03_all<5)
  SDVTrack_mindRdphideta: "Vertex_mindRdetadphi(SDVTrack_phi,SDVTrack_eta,Jet_phi_sel,Jet_eta_sel)"
  SDVTrack_isinJet: "SDVTrack_mindRdphideta[0]<0.4"
  nSDVTrack_lowdphi: "Sum(SDVTrack_dphi_MET<1.5)"
  nSDVTrack_highdphi: "Sum(SDVTrack_dphi_MET>1.5)"
  nGoodTrack_lowdphi: "Sum((SDVTrack_dphi_MET<1.5) && (SDVTrack_isGoodTrack))"
  nGoodTrack_highdphi: "Sum((SDVTrack_dphi_MET>1.5) && (SDVTrack_isGoodTrack) )"
  nSDVTrack_outjet_lowdphi: "Sum((SDVTrack_dphi_MET<1.5) && (!SDVTrack_isinJet))"
  nSDVTrack_outjet_highdphi: "Sum((SDVTrack_dphi_MET>1.5) && (!SDVTrack_isinJet))"
  nGoodTrack_outjet_lowdphi: "Sum((SDVTrack_dphi_MET<1.5) && (SDVTrack_isGoodTrack) && (!SDVTrack_isinJet))"
  nGoodTrack_outjet_highdphi: "Sum((SDVTrack_dphi_MET>1.5) && (SDVTrack_isGoodTrack) && (!SDVTrack_isinJet))"
  nSDVTrack_outjet0_lowdphi: "Sum((SDVTrack_dphi_MET<1.5) && (SDVTrack_dR_jet0>0.4))"
  nSDVTrack_outjet0_highdphi: "Sum((SDVTrack_dphi_MET>1.5) && (SDVTrack_dR_jet0>0.4))"
  nGoodTrack_outjet0_lowdphi: "Sum((SDVTrack_dphi_MET<1.5) && (SDVTrack_isGoodTrack) && (SDVTrack_dR_jet0>0.4))"
  nGoodTrack_outjet0_highdphi: "Sum((SDVTrack_dphi_MET>1.5) && (SDVTrack_isGoodTrack) && (SDVTrack_dR_jet0>0.4))"
