  SDVSecVtx_pAngle_phys: SDVSecVtx_PhyspAngle(SDVIdxLUT_SecVtxIdx,SDVIdxLUT_TrackIdx,SDVIdxLUT_TrackWeight,SDVRefitTrack_svIdx,SDVRefitTrack_tkIdx,SDVRefitTrack_pt,SDVRefitTrack_eta,SDVRefitTrack_phi,SDVSecVtx_dx,SDVSecVtx_dy,SDVSecVtx_dz)
  #SDVSecVtx_nGoodTrack: SDVSecVtx_nGoodPhysTrack(SDVIdxLUT_SecVtxIdx,SDVIdxLUT_TrackIdx,SDVTrack_isGoodTrack,SDVTrack_pt,SDVTrack_eta,SDVTrack_phi,SDVSecVtx_dx,SDVSecVtx_dy,SDVSecVtx_dz)
  SDVTrack_isnonPU: ( SDVTrack_dxydzratio>0.25 )
