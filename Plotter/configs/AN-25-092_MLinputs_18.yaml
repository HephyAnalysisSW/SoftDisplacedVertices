  b0_nok0_sel_tight:       SDVSecVtx_closestbJetdR_tight<0.4    &&  !k0_sel
  nob0_nok0_sel_tight:     SDVSecVtx_closestbJetdR_medium>0.4   &&  !k0_sel  &&  SDVSecVtx_closestJetdR<0.4
  
  # b0_nok0_sel_medium_nodR:                                         (SDVSecVtx_mass<0.490 || SDVSecVtx_mass>0.505) && SDVSecVtx_ndof>1

  b0_sel_medium:      SDVSecVtx_closestbJetdR_medium<0.1     && SDVSecVtx_ndof>1
  b0_sel_tight:       SDVSecVtx_closestbJetdR_tight< 0.1     && SDVSecVtx_ndof>1
  b0_sel_medium_nodR:                                           SDVSecVtx_ndof>1

  SP_vertexCuts:   SDVSecVtx_mapveto==0
  SP3_vertexCuts:  SDVSecVtx_mapveto==0 && SDVSecVtx_ngoodtk>=3
  SP2_vertexCuts:  SDVSecVtx_mapveto==0 && SDVSecVtx_ngoodtk==2
  SP1_vertexCuts:  SDVSecVtx_mapveto==0 && SDVSecVtx_ngoodtk==1
  SP0_vertexCuts:  SDVSecVtx_mapveto==0 && SDVSecVtx_ngoodtk==0

  CP3_vertexCuts:  SDVSecVtx_mapveto==0 && SDVSecVtx_ngoodtk>=3
  CP2_vertexCuts:  SDVSecVtx_mapveto==0 && SDVSecVtx_ngoodtk==2
  CP1_vertexCuts:  SDVSecVtx_mapveto==0 && SDVSecVtx_ngoodtk==1
  CP0_vertexCuts:  SDVSecVtx_mapveto==0 && SDVSecVtx_ngoodtk==0
  
  material:        SDVSecVtx_mapveto==1

  nSDVSecVtx_SP:    Sum(SP_vertexCuts)
  nSDVSecVtx_SP3:   Sum(SP3_vertexCuts)
  nSDVSecVtx_SP2:   Sum(SP2_vertexCuts)
  nSDVSecVtx_SP1:   Sum(SP1_vertexCuts)
  nSDVSecVtx_SP0:   Sum(SP0_vertexCuts)

  nSDVSecVtx_CP3:   Sum(CP3_vertexCuts)
  nSDVSecVtx_CP2:   Sum(CP2_vertexCuts)
  nSDVSecVtx_CP1:   Sum(CP1_vertexCuts)
  nSDVSecVtx_CP0:   Sum(CP0_vertexCuts)

  nSDVSecVtx_material: Sum(material)

  SP3_Max_ML_score:  Max(ML_score[SP3_vertexCuts])
  SP2_Max_ML_score:  Max(ML_score[SP2_vertexCuts])
  SP1_Max_ML_score:  Max(ML_score[SP1_vertexCuts])
  SP0_Max_ML_score:  Max(ML_score[SP0_vertexCuts])

  CP3_Max_ML_score:  Max(ML_score[CP3_vertexCuts])
  CP2_Max_ML_score:  Max(ML_score[CP2_vertexCuts])
  CP1_Max_ML_score:  Max(ML_score[CP1_vertexCuts])
  CP0_Max_ML_score:  Max(ML_score[CP0_vertexCuts])



  material_Max_ML_score: Max(ML_score[material])
  nob0_Max_ML_score:     Max(ML_score[nob0_nok0_sel_tight])
  b0_Max_ML_score:       Max(ML_score[b0_nok0_sel_tight])
  k0_Max_ML_score:       Max(ML_score[k0_sel])




  ML_score_SP0:  ML_score[SP0_vertexCuts]
  ML_score_SP1:  ML_score[SP1_vertexCuts]
  ML_score_SP2:  ML_score[SP2_vertexCuts]
  ML_score_SP3:  ML_score[SP3_vertexCuts]

  ML_score_CP0:  ML_score[CP0_vertexCuts]
  ML_score_CP1:  ML_score[CP1_vertexCuts]
  ML_score_CP2:  ML_score[CP2_vertexCuts]
  ML_score_CP3:  ML_score[CP3_vertexCuts]

  argmax_ML_score:      ArgMax(ML_score)
  argmax_ML_score_SP0:  ArgMax(ML_score_SP0)
  argmax_ML_score_SP1:  ArgMax(ML_score_SP1)
  argmax_ML_score_SP2:  ArgMax(ML_score_SP2)
  argmax_ML_score_SP3:  ArgMax(ML_score_SP3)

  argmax_ML_score_CP0:  ArgMax(ML_score_CP0)
  argmax_ML_score_CP1:  ArgMax(ML_score_CP1)
  argmax_ML_score_CP2:  ArgMax(ML_score_CP2)
  argmax_ML_score_CP3:  ArgMax(ML_score_CP3)

  SDVSecVtx_dphiMET_SP0:  SDVSecVtx_dphiMET[SP0_vertexCuts]
  SDVSecVtx_dphiMET_SP1:  SDVSecVtx_dphiMET[SP1_vertexCuts]
  SDVSecVtx_dphiMET_SP2:  SDVSecVtx_dphiMET[SP2_vertexCuts]
  SDVSecVtx_dphiMET_SP3:  SDVSecVtx_dphiMET[SP3_vertexCuts]

  SDVSecVtx_dphiMET_CP0:  SDVSecVtx_dphiMET[CP0_vertexCuts]
  SDVSecVtx_dphiMET_CP1:  SDVSecVtx_dphiMET[CP1_vertexCuts]
  SDVSecVtx_dphiMET_CP2:  SDVSecVtx_dphiMET[CP2_vertexCuts]
  SDVSecVtx_dphiMET_CP3:  SDVSecVtx_dphiMET[CP3_vertexCuts]

  leading_vtx_dphiMET:     "SDVSecVtx_dphiMET.size() != 0 ? SDVSecVtx_dphiMET[argmax_ML_score] : -1"
  leading_vtx_SP0_dphiMET: "((SDVSecVtx_dphiMET_SP0.size() != 0) && (ML_score_SP0.size() == SDVSecVtx_dphiMET_SP0.size())) ? SDVSecVtx_dphiMET_SP0[argmax_ML_score_SP0] : -1"
  leading_vtx_SP1_dphiMET: "((SDVSecVtx_dphiMET_SP1.size() != 0) && (ML_score_SP1.size() == SDVSecVtx_dphiMET_SP1.size())) ? SDVSecVtx_dphiMET_SP1[argmax_ML_score_SP1] : -1"
  leading_vtx_SP2_dphiMET: "((SDVSecVtx_dphiMET_SP2.size() != 0) && (ML_score_SP2.size() == SDVSecVtx_dphiMET_SP2.size())) ? SDVSecVtx_dphiMET_SP2[argmax_ML_score_SP2] : -1"
  leading_vtx_SP3_dphiMET: "((SDVSecVtx_dphiMET_SP3.size() != 0) && (ML_score_SP3.size() == SDVSecVtx_dphiMET_SP3.size())) ? SDVSecVtx_dphiMET_SP3[argmax_ML_score_SP3] : -1"

  leading_vtx_CP0_dphiMET: "((SDVSecVtx_dphiMET_CP0.size() != 0) && (ML_score_CP0.size() == SDVSecVtx_dphiMET_CP0.size())) ? SDVSecVtx_dphiMET_CP0[argmax_ML_score_CP0] : -1"
  leading_vtx_CP1_dphiMET: "((SDVSecVtx_dphiMET_CP1.size() != 0) && (ML_score_CP1.size() == SDVSecVtx_dphiMET_CP1.size())) ? SDVSecVtx_dphiMET_CP1[argmax_ML_score_CP1] : -1"
  leading_vtx_CP2_dphiMET: "((SDVSecVtx_dphiMET_CP2.size() != 0) && (ML_score_CP2.size() == SDVSecVtx_dphiMET_CP2.size())) ? SDVSecVtx_dphiMET_CP2[argmax_ML_score_CP2] : -1"
  leading_vtx_CP3_dphiMET: "((SDVSecVtx_dphiMET_CP3.size() != 0) && (ML_score_CP3.size() == SDVSecVtx_dphiMET_CP3.size())) ? SDVSecVtx_dphiMET_CP3[argmax_ML_score_CP3] : -1"



