vtx_loosesel: SDVSecVtx_mapveto==0
vtx_sel_3gt: (SDVSecVtx_nGoodTrack>=3) && (SDVSecVtx_mapveto==0)
vtx_sel_2gt: (SDVSecVtx_nGoodTrack==2) && (SDVSecVtx_mapveto==0)
vtx_sel_1gt: (SDVSecVtx_nGoodTrack==1) && (SDVSecVtx_mapveto==0)
vtx_sel_0gt: (SDVSecVtx_nGoodTrack==0) && (SDVSecVtx_mapveto==0)
bjetloose: (Jet_jetId_TightLepVeto) && (abs(Jet_eta)<2.4) && (Jet_neHEF<0.8) && (Jet_chHEF>0.1) && (Jet_pt_corr>20) && (Jet_btag_loose)
bjetmedium: (Jet_jetId_TightLepVeto) && (abs(Jet_eta)<2.4) && (Jet_neHEF<0.8) && (Jet_chHEF>0.1) && (Jet_pt_corr>20) && (Jet_btag_medium)
bjettight: (Jet_jetId_TightLepVeto) && (abs(Jet_eta)<2.4) && (Jet_neHEF<0.8) && (Jet_chHEF>0.1) && (Jet_pt_corr>20) && (Jet_btag_tight)
bjetgen: Jet_hadronFlavour>=4 && Jet_hadronFlavour<=5
muon_sel: (Muon_looseId>0) && (abs(Muon_eta)<2.4) && (Muon_pt>10)
ele_sel: (Electron_cutBased>=1) && (abs(Electron_eta)<2.5) && (Electron_pt>10)
photon_sel: (Photon_cutBased>=1) && (abs(Photon_eta)<2.5) && (Photon_pt>15)
tau_sel: (Tau_idDeepTau2018v2p5VSmu>0) && (Tau_idDeepTau2018v2p5VSe>0) && (Tau_idDeepTau2018v2p5VSjet>0) && (abs(Tau_eta)<2.5) && (Tau_pt>20) && (abs(Tau_dz)<0.2)
jet_sel: (Jet_jetId_TightLepVeto) && (abs(Jet_eta)<2.4) && (Jet_neHEF<0.8) && (Jet_chHEF>0.1) && (Jet_pt_corr>20)
jet_sel_mapveto: (Jet_jetId_TightLepVeto) && (Jet_neEmEF+Jet_chEmEF<0.9) && (Jet_pt_corr>15)

presel: HLT_PFMETNoMu120_PFMHTNoMu120_IDTight && MET_pt_corr>350 && veto_jet_sel_ecalBadCalib==0 && nJet_sel>0 && leadingjet_pt>100 && dphi_MET_jet0>1.0 && nMuon_sel==0 && nEle_sel==0 && nPhoton_sel==0 && nTau_sel==0

