new_variables:
    veto_jet_sel_ecalBadCalib: "isData*(run>=362433)*(run<=367144)*(MET_pt_corr>100)*Sum((Jet_pt_corr>15) && (Jet_eta<-0.5) && (Jet_eta>-1.0) && (Jet_phi<-1.8) && (Jet_phi>-2.1) && ( (Jet_neEmEF>0.9) || (Jet_chEmEF>0.9) ) && (acos(cos(Jet_phi-MET_phi_corr)) ))"
    Jet_pt_sel: ['Jet_pt_corr[{0}]',jet_sel]
    Jet_eta_sel: ['Jet_eta[{0}]',jet_sel]
    Jet_phi_sel: ['Jet_phi[{0}]',jet_sel]
    Jet_chHEF_sel: ['Jet_chHEF[{0}]',jet_sel]
    Jet_neHEF_sel: ['Jet_neHEF[{0}]',jet_sel]
    Jet_nConstituents_sel: ['Jet_nConstituents[{0}]',jet_sel]
    nJet_sel: ['Sum({0})',jet_sel]
    leadingjet_pt: Jet_pt_sel[0]
    leadingjet_phi: Jet_phi_sel[0]
    leadingjet_eta: Jet_eta_sel[0]
    leadingjet_chHEF: Jet_chHEF_sel[0]
    leadingjet_neHEF: Jet_neHEF_sel[0]
    leadingjet_nConstituents: Jet_nConstituents_sel[0]
    dphi_MET_jet0: acos(cos(leadingjet_phi-MET_phi_corr))
    JetHT: 'Sum(Jet_pt_sel)'
    JetHT20: 'Sum(Jet_pt_sel[Jet_pt_sel>20.])'
    JetHT40: 'Sum(Jet_pt_sel[Jet_pt_sel>40.])'
    nMuon_sel: ['Sum({0})', muon_sel]
    nEle_sel: ['Sum({0})', ele_sel]
    nPhoton_sel: ['Sum({0})', photon_sel]
    nTau_sel: ['Sum({0})', tau_sel]
    nbJet_loose: ['Sum({0})',bjetloose]
    nbJet_medium: ['Sum({0})',bjetmedium]
    nbJet_tight: ['Sum({0})',bjettight]
    bJet_eta_loose: ['Jet_eta[{0}]',bjetloose]
    bJet_phi_loose: ['Jet_phi[{0}]',bjetloose]
    bJet_eta_medium: ['Jet_eta[{0}]',bjetmedium]
    bJet_phi_medium: ['Jet_phi[{0}]',bjetmedium]
    bJet_eta_tight: ['Jet_eta[{0}]',bjettight]
    bJet_phi_tight: ['Jet_phi[{0}]',bjettight]
    SDVTrack_isInSV: Track_isInSV(SDVIdxLUT_TrackIdx,nSDVTrack)
    SDVTrack_qoverp: SDVTrack_charge/SDVTrack_pt
    SDVTrack_dxySig: abs(SDVTrack_dxy)/SDVTrack_dxyError
    SDVTrack_dzSig: abs(SDVTrack_dz)/SDVTrack_dzError
    SDVTrack_ptqual: SDVTrack_ptError/SDVTrack_pt
    SDVTrack_dphi_jet0: acos(cos(SDVTrack_phi-leadingjet_phi))
    SDVTrack_deta_jet0: abs(SDVTrack_eta-leadingjet_eta)
    SDVTrack_dR_jet0: sqrt(SDVTrack_dphi_jet0*SDVTrack_dphi_jet0 + SDVTrack_deta_jet0*SDVTrack_deta_jet0)
    SDVTrack_dphi_MET: acos(cos(SDVTrack_phi-MET_phi_corr))
    SDVTrack_dxydzratio: abs(SDVTrack_dxy/SDVTrack_dz)
    #SDVTrack_isGoodTrack: ( (abs(SDVTrack_dxy)/SDVTrack_dxyError)>4 ) && (SDVTrack_normalizedChi2 < 5) && (SDVTrack_numberOfValidHits>13) && ( (SDVTrack_ptError/SDVTrack_pt)<0.015 ) && ( SDVTrack_dxydzratio>0.25 ) && ( SDVTrack_dphi_jet0>1 ) && ( SDVTrack_dphi_MET<1.5 ) && (SDVTrack_pfRelIso03_all<5)
    SDVTrack_isGoodTrack: ( (abs(SDVTrack_dxy)/SDVTrack_dxyError)>4 ) && (SDVTrack_normalizedChi2 < 5) && (SDVTrack_numberOfValidHits>13) && ( (SDVTrack_ptError/SDVTrack_pt)<0.015 ) && ( SDVTrack_dxydzratio>0.25 ) && (SDVTrack_pfRelIso03_all<5)
    SDVSecVtx_nGoodTrack: SDVSecVtx_nGoodTrack(SDVIdxLUT_SecVtxIdx,SDVIdxLUT_TrackIdx,SDVTrack_isGoodTrack,nSDVSecVtx)
    SDVTrack_isnonPU: ( SDVTrack_dxydzratio>0.25 )
    SDVSecVtx_nnonPUTrack: SDVSecVtx_nselTrack(SDVIdxLUT_SecVtxIdx,SDVIdxLUT_TrackIdx,SDVTrack_isnonPU,nSDVSecVtx)
    SDVSecVtx_dphiMET: 'acos(cos(SDVSecVtx_L_phi-MET_phi_corr))'
    SDVSecVtx_dphijet0: 'acos(cos(SDVSecVtx_L_phi-leadingjet_phi))'
    SDVSecVtx_Lxy_err: "SDVSecVtx_Lxy/SDVSecVtx_LxySig"
    SDVSecVtx_dlen_err: "SDVSecVtx_dlen/SDVSecVtx_dlenSig"
    SDVSecVtx_L_eta_abs: "abs(SDVSecVtx_L_eta)"
    SDVSecVtx_TkMaxdphi: "SDV_TkMaxdphi(SDVIdxLUT_TrackIdx, SDVIdxLUT_SecVtxIdx, nSDVSecVtx, SDVTrack_phi)"
    SDVSecVtx_TkMindphi: "SDV_TkMindphi(SDVIdxLUT_TrackIdx, SDVIdxLUT_SecVtxIdx, nSDVSecVtx, SDVTrack_phi)"
    SDVSecVtx_TkMaxdeta: "SDV_TkMaxdphi(SDVIdxLUT_TrackIdx, SDVIdxLUT_SecVtxIdx, nSDVSecVtx, SDVTrack_eta)"
    SDVSecVtx_TkMindeta: "SDV_TkMindphi(SDVIdxLUT_TrackIdx, SDVIdxLUT_SecVtxIdx, nSDVSecVtx, SDVTrack_eta)"
    SDVSecVtx_TkMaxdR: "SDV_TkMaxdR(SDVIdxLUT_TrackIdx, SDVIdxLUT_SecVtxIdx, nSDVSecVtx, SDVTrack_eta, SDVTrack_phi)"
    SDVSecVtx_TkMindR: "SDV_TkMindR(SDVIdxLUT_TrackIdx, SDVIdxLUT_SecVtxIdx, nSDVSecVtx, SDVTrack_eta, SDVTrack_phi)"
    SDVSecVtx_mindRdphideta: "Vertex_mindRdetadphi(SDVSecVtx_L_phi,SDVSecVtx_L_eta,Jet_phi_sel,Jet_eta_sel)"
    SDVSecVtx_closestJetdR: "SDVSecVtx_mindRdphideta[0]"
    SDVSecVtx_closestJetdphi: "SDVSecVtx_mindRdphideta[1]"
    SDVSecVtx_closestJetdeta: "SDVSecVtx_mindRdphideta[2]"
    SDVSecVtx_mindRdphidetabJet_loose: "Vertex_mindRdetadphi(SDVSecVtx_L_phi,SDVSecVtx_L_eta,bJet_phi_loose,bJet_eta_loose)"
    SDVSecVtx_closestbJetdRloose: "SDVSecVtx_mindRdphidetabJet_loose[0]"
    SDVSecVtx_closestbJetdphi_loose: "SDVSecVtx_mindRdphidetabJet_loose[1]"
    SDVSecVtx_closestbJetdeta_loose: "SDVSecVtx_mindRdphidetabJet_loose[2]"
    SDVSecVtx_mindRdphidetabJet_medium: "Vertex_mindRdetadphi(SDVSecVtx_L_phi,SDVSecVtx_L_eta,bJet_phi_medium,bJet_eta_medium)"
    SDVSecVtx_closestbJetdRmedium: "SDVSecVtx_mindRdphidetabJet_medium[0]"
    SDVSecVtx_closestbJetdphi_medium: "SDVSecVtx_mindRdphidetabJet_medium[1]"
    SDVSecVtx_closestbJetdeta_medium: "SDVSecVtx_mindRdphidetabJet_medium[2]"
    SDVSecVtx_mindRdphidetabJet_tight: "Vertex_mindRdetadphi(SDVSecVtx_L_phi,SDVSecVtx_L_eta,bJet_phi_tight,bJet_eta_tight)"
    SDVSecVtx_closestbJetdRtight: "SDVSecVtx_mindRdphidetabJet_tight[0]"
    SDVSecVtx_closestbJetdphi_tight: "SDVSecVtx_mindRdphidetabJet_tight[1]"
    SDVSecVtx_closestbJetdeta_tight: "SDVSecVtx_mindRdphidetabJet_tight[2]"
    SDVSecVtx_loose_sel: ['{0}', vtx_loosesel]
    ML_score: vtx_PART_1111best_valloss_epoch
    ML_score_clone1 : ML_score
    ML_score_clone2 : ML_score
    nSDVSecVtx_3gt: ['Sum({0})', vtx_sel_3gt]
    nSDVSecVtx_2gt: ['Sum({0})', vtx_sel_2gt]
    nSDVSecVtx_1gt: ['Sum({0})', vtx_sel_1gt]
    nSDVSecVtx_0gt: ['Sum({0})', vtx_sel_0gt]
    leadingvtx_info: "Leading_Vtx_Idx_ML(SDVSecVtx_loose_sel, ML_score)"
    leadingvtx_idx: "leadingvtx_info.first"
    SDVSecVtx_isLeading: "leadingvtx_info.second"
    leadingvtx_MLscore: "ML_score[leadingvtx_idx]"
    leadingvtx_dphiMET: "SDVSecVtx_dphiMET[leadingvtx_idx]"
    leadingvtx_nGoodTracks: "SDVSecVtx_nGoodTrack[leadingvtx_idx]"

