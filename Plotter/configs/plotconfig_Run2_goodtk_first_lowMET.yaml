      name: "Collisions18_UltraLegacy_goldenJSON"
      mode: "nominal"
  met:
    mode: "nominal"
  metxy: True
  JERC: False

mapveto:
  data_path: "root://eos.grid.vbc.ac.at//eos/vbc/group/cms/ang.li/material_map/material_map_2tk_loose.root"
  mc_path:   "root://eos.grid.vbc.ac.at//eos/vbc/group/cms/ang.li/material_map/material_map_2tk_loose.root"

weights:

