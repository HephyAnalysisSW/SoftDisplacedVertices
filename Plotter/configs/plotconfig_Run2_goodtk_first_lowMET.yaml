### GLOBAL DEFINITIONS
vtx_loosesel: (SDVSecVtx_mapveto==0)

muon_sel:   (Muon_looseId>0)           && (abs(Muon_eta)<2.4)     && (Muon_pt>10)
ele_sel:    (Electron_cutBased>=1)     && (abs(Electron_eta)<2.5) && (Electron_pt>10)
photon_sel: (Photon_cutBased>=1)       && (abs(Photon_eta)<2.5)   && (Photon_pt>15)
tau_sel:    (Tau_idDeepTau2017v2p1VSmu>0) && (Tau_idDeepTau2017v2p1VSe>0) && (Tau_idDeepTau2017v2p1VSjet>0) && (abs(Tau_eta)<2.3) && (Tau_pt>20) && (abs(Tau_dz)<0.2)

bjetgen:         Jet_hadronFlavour>=4 && Jet_hadronFlavour<=5
jet_selHEM:      (Jet_jetId==6) 
jet_sel:         (Jet_jetId==6) && (abs(Jet_eta)<2.4) && (Jet_neHEF<0.8) && (Jet_chHEF>0.1) && (Jet_pt>20)
bjetloose: (Jet_jetId==6) && (abs(Jet_eta)<2.4) && (Jet_neHEF<0.8) && (Jet_chHEF>0.1) && (Jet_pt>20) && (Jet_btagDeepFlavB>0.0490)
bjetmedium: (Jet_jetId==6) && (abs(Jet_eta)<2.4) && (Jet_neHEF<0.8) && (Jet_chHEF>0.1) && (Jet_pt>20) && (Jet_btagDeepFlavB>0.2783)
bjettight: (Jet_jetId==6) && (abs(Jet_eta)<2.4) && (Jet_neHEF<0.8) && (Jet_chHEF>0.1) && (Jet_pt>20) && (Jet_btagDeepFlavB>0.7100)

presel:          HLT_PFMETNoMu120_PFMHTNoMu120_IDTight && MET_pt_corr>200                 &&
                 nMuon_sel==0 && nEle_sel==0 && nPhoton_sel==0 && nTau_sel==0             &&
                 nJet_sel > 0 && leadingjet_pt > 100 && nJetHEM == 0 && dphi_MET_jet0 > 1.0

corrections:
  PU:
    "2017":
      path: "/cvmfs/cms.cern.ch/rsync/cms-nanoAOD/jsonpog-integration/POG/LUM/2017_UL/puWeights.json.gz"
      name: "Collisions17_UltraLegacy_goldenJSON"
      mode: "nominal"
    "2018":
