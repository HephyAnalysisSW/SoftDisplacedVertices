muon_sel: (Muon_looseId>0) && (Muon_eta<2.4) && (Muon_pt>10)
muon_tight_sel: (Muon_tightId>0) && abs(Muon_eta)<2.4 && (Muon_pt>27)
ele_sel: (Electron_cutBased>=1) && (Electron_eta<2.5) && (Electron_pt>10)
photon_sel: (Photon_cutBased>=1) && (Photon_eta<2.5) && (Photon_pt>15)
tau_sel: (Tau_idDecayModeOldDMs>=1) && (Tau_eta<2.3) && (Tau_pt>18)
jet_sel: (Jet_jetId_TightLepVeto) && (abs(Jet_eta)<2.4) && (Jet_neHEF<0.8) && (Jet_chHEF>0.1) && (Jet_pt_corr>20)
jet_sel_mapveto: (Jet_jetId_TightLepVeto) && (Jet_neEmEF+Jet_chEmEF<0.9) && (Jet_pt_corr>15)
#met_hlt : (HLT_PFMETNoMu120_PFMHTNoMu120_IDTight==1)

presel: MET_pt>0 && veto_jet_sel_ecalBadCalib==0 && nMuon_tight_sel==1

