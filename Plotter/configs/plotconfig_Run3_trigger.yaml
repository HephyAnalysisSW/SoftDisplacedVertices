    Muon:
        selections:
            all:
            tight_sel: (Muon_tightId>0) && abs(Muon_eta)<2.4 && (Muon_pt>27)
        variables:
        - Muon_pt
        2d_plots:


plot_setting:
    MET_pt_corr: [MET_pt_corr,'MET_corr_pt',100,0,1000]
    MET_phi_corr: [MET_phi_corr,'MET_corr_phi',128,-3.2,3.2]
    Jet_pt_corr: [Jet_pt_corr,'Jet_pt_corr',100,0,1000]
    Jet_mass_corr: [Jet_mass_corr,'Jet_mass_corr',100,0,1000]
    MET_pt_nomu: [MET_pt_nomu,'MET_pt_nomu',100,0,1000]
    Muon_pt: [Muon_pt,'Muon_pt',100,0,1000]
    Muon_pt_sel: [Muon_pt_sel,'Muon_pt_sel',100,0,1000]
    nMuon_sel: [nMuon_sel,';nMuons;A.U.',10,0,10]
    nMuon_tight_sel: [nMuon_tight_sel,';nMuons tight;A.U.',10,0,10]
    HLT_PFMETNoMu120_PFMHTNoMu120_IDTight: [HLT_PFMETNoMu120_PFMHTNoMu120_IDTight, ';HLT path fired;A.U.',2,0,2]