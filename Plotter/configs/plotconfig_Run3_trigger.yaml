    JERC: True

new_variables:
    veto_jet_sel_ecalBadCalib: "isData*(run>=362433)*(run<=367144)*(MET_pt_corr>100)*Sum((Jet_pt_corr>15) && (Jet_eta<-0.5) && (Jet_eta>-1.0) && (Jet_phi<-1.8) && (Jet_phi>-2.1) && ( (Jet_neEmEF>0.9) || (Jet_chEmEF>0.9) ) && (acos(cos(Jet_phi-MET_phi_corr)) ))"
    Muon_pt_sel: ['Muon_pt[{0}]',muon_tight_sel]
    Muon_phi_sel: ['Muon_phi[{0}]',muon_tight_sel]
    MET_pt_nomu : "met_no_mu(MET_pt_corr, MET_phi_corr, Muon_pt_sel, Muon_phi_sel)"
    nMuon_sel: ['Sum({0})',muon_sel]
    nMuon_tight_sel: ['Sum({0})',muon_tight_sel]

regions:
  All: 
  #MET: MET_pt_corr > 200
  num: (HLT_PFMETNoMu120_PFMHTNoMu120_IDTight==1)
event_variables:
    - MET_pt_corr
    - MET_phi_corr
    - MET_pt_nomu
    - nMuon_sel
    - nMuon_tight_sel
    - HLT_PFMETNoMu120_PFMHTNoMu120_IDTight
event_2d_plots:

